site_name: My Notes
site_url: https://USERNAME.github.io/notes-portal/
site_description: Jo bhi parha, sab yahan.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
